<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1320">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Circuit Sandbox 2D</title>
<style>
:root{--bg:#0e1320;--pn:#161d2e;--bd:#2a3550;--tx:#e6ebf5;--mu:#8793ad;--gr:#1a2236;color-scheme:dark light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#eef1f7;--pn:#fff;--bd:#c7cfdf;--tx:#1b2233;--mu:#5b6578;--gr:#dde3ef}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
#wrap{position:relative;flex:1;min-height:0}
canvas{display:block;touch-action:none}
#log{position:absolute;left:8px;top:8px;right:8px;pointer-events:none;font-size:13px;text-shadow:0 1px 2px var(--bg)}
#log div{background:color-mix(in srgb,var(--pn) 85%,transparent);padding:3px 8px;margin-bottom:2px;border-radius:6px;width:fit-content;max-width:100%}
#chat{position:absolute;left:8px;right:8px;bottom:8px;padding:9px 12px;border-radius:8px;border:2px solid #3b82f6;background:var(--pn);color:var(--tx);font:15px system-ui}
#chat[hidden]{display:none}
#joy{display:none;position:absolute;left:22px;bottom:22px;width:124px;height:124px;border:2px solid #94a3b866;border-radius:50%;background:#0f172a66;z-index:8;touch-action:none;user-select:none}
#joyknob{position:absolute;left:50%;top:50%;width:48px;height:48px;transform:translate(-50%,-50%);border:2px solid #cbd5e1aa;border-radius:50%;background:#64748bba;box-shadow:0 2px 10px #0006;pointer-events:none}
#bar{background:var(--pn);border-top:1px solid var(--bd);padding:6px 8px;display:flex;flex-direction:column;gap:5px}
#st{color:var(--mu);font-size:12px;min-height:16px}
#bar .row{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px}
button{flex:none;background:var(--bg);color:var(--tx);border:1.5px solid var(--bd);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
button.on{background:#3b82f6;color:#fff;border-color:#3b82f6}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid #f59e0b;outline-offset:1px}
.sw{width:34px;height:34px;padding:0}.sw.on{outline:3px solid var(--tx)}
:root{--ac:#22c55e;--acx:#0b1b12}
#gear{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:42px;height:42px;padding:0;font-size:20px;border-radius:50%;z-index:5}
#panel{position:absolute;left:58px;top:50%;transform:translateY(-50%);width:min(300px,calc(100% - 70px));max-height:calc(100% - 20px);overflow:auto;background:var(--pn);border:1.5px solid var(--bd);border-radius:12px;padding:10px;z-index:5;display:flex;flex-direction:column;gap:8px}
#panel[hidden]{display:none}
#panel h4{margin:4px 0 0;font-size:13px;color:var(--mu)}
#panel select,#panel input{background:var(--bg);color:var(--tx);border:1.5px solid var(--bd);border-radius:6px;padding:4px;font:inherit}
.prow{display:flex;justify-content:space-between;align-items:center;gap:6px}
.th{display:flex;flex-wrap:wrap;gap:5px}
#menu{position:fixed;inset:0;z-index:20;display:flex;align-items:safe center;justify-content:center;overflow:auto;padding:16px;box-sizing:border-box;background:color-mix(in srgb,var(--ac) 22%,#fff);color:color-mix(in srgb,var(--ac) 30%,#000)}
#menu[hidden]{display:none}
#mc{width:min(440px,100%);background:color-mix(in srgb,var(--ac) 8%,#fff);border:2px solid var(--ac);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px}
#mc h1{margin:0;font-size:26px}#mc h2{margin:0;font-size:18px}#mc h4{margin:4px 0 0}
#mc input[type=text],#mc input[type=password]{padding:10px;border-radius:8px;border:1.5px solid var(--ac);font:inherit;background:#fff;color:#111}
#mc button{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600;padding:10px}
#mc button.alt{background:transparent;color:inherit}
#mc .err{color:#b91c1c;min-height:18px;font-size:13px}
#mc .srv{text-align:left;background:color-mix(in srgb,var(--sc) 20%,#fff);color:#10251a;border:2px solid var(--sc)}
#mc .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:5px;max-height:45vh;overflow:auto}
#mc .slots button{padding:6px 0}

/* Mobile layout */
@media (max-width: 700px), (max-height: 560px) and (pointer: coarse){
  html,body{height:100%;height:100dvh;overscroll-behavior:none}
  #bar{gap:4px;padding:5px 6px calc(5px + env(safe-area-inset-bottom,0px));}
  #bar .row{gap:4px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
  #bar button{min-height:38px;padding:7px 10px;font-size:13px;white-space:nowrap;touch-action:manipulation}
  #bar .sw{width:38px;height:38px;padding:0}
  #st{font-size:10px;min-height:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #gear{top:8px;right:8px;left:auto;transform:none;width:42px;height:42px;background:var(--pn);}
  #panel{left:8px;right:8px;top:58px;bottom:auto;transform:none;width:auto;max-height:55%;}
  #chat{font-size:16px;bottom:8px;left:8px;right:8px;width:calc(100% - 40px);}
  #joy{display:block}
  #menu{align-items:flex-start;padding: max(10px,env(safe-area-inset-top,0px)) 10px max(10px,env(safe-area-inset-bottom,0px));}
  #mc{width:100%;max-width:440px;margin:auto 0;padding:16px;gap:9px;max-height:calc(100dvh - 20px);overflow:auto}
  #mc h1{font-size:23px}
  #mc button{min-height:44px;font-size:15px;touch-action:manipulation}
  #mc input[type=text],#mc input[type=password]{min-height:42px;font-size:16px}
  #mc .slots{grid-template-columns:repeat(auto-fill,minmax(48px,1fr));max-height:34dvh}
}
@media (max-width: 700px) and (orientation: portrait){
  #bar{max-height:37dvh}
  #wrap{min-height:0}
}
@media (max-width: 900px) and (orientation: landscape){
  #bar{max-height:42dvh}
  #mc{max-height:calc(100dvh - 16px);padding:12px}
}
</style></head><body>
<div id="wrap"><canvas id="cv"></canvas><div id="log"></div><div id="joy" aria-label="Joystick para andar"><div id="joyknob"></div></div><button id="gear" aria-label="Configurações">⚙️</button><div id="panel" hidden></div><input id="chat" hidden placeholder="/help" autocomplete="off"></div>
<div id="bar"><div id="st"></div><div class="row" id="tools"></div><div class="row" id="tabs"></div><div class="row" id="parts"></div></div>
<div id="menu"><div id="mc"></div></div>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),g=cv.getContext('2d'),chat=$('#chat'),CS=getComputedStyle(document.documentElement),cvar=n=>CS.getPropertyValue(n).trim();
const S=44,DIR=[[0,-1],[1,0],[0,1],[-1,0]],K=(x,y)=>x+','+y;
const CC={Logic:'#3b82f6',Inputs:'#22c55e',Outputs:'#f59e0b',Blocks:'#94a3b8',Others:'#a855f7',Hidden:'#ef4444'},CATS=Object.keys(CC);
const PAL=['#ef4444','#f97316','#facc15','#4ade80','#22d3ee','#3b82f6','#a855f7','#ec4899','#ffffff','#8b95a5'];
const TOOLS=[['use','👆','Interagir'],['build','🧱','Build'],['wire','🔌','Wire'],['delete','🗑️','Delete'],['paint','🎨','Paint'],['select','⬚','Seleção']];
const HINT={use:'Clique em alavancas e botões · arraste o fundo para mover o mapa · WASD anda, Shift corre · / abre o chat',build:'Clique ou arraste para posicionar · R/T giram · Y espelha',wire:'Clique na peça de origem e depois na de destino (metade esquerda/direita escolhe a entrada)',delete:'Clique numa peça ou num fio',paint:'Escolha uma cor e clique na peça',select:'Arraste para selecionar · C copia · X recorta · V cola · Del apaga'};
let W=0,H=0,dpr=1,cam={x:.5,y:.5},zm=1,T=0,nid=1,tool='use',cat='Logic',selT='AND',rot=0,pend=null,hover={x:0,y:0},M=[0,0],sel=new Set(),clip=null,drag=null,selR=null,paintC='#ef4444',lastC=null,air={},ext=new Set(),nxt=new Set(),tpc=0,expl=[],flash=0,alarm=0,muted=false,keys={},AC,role='solo',scr='auth',net={},ver=0,dirty=0,lastW=0,myLv=4,defPerm=1,perm={},nick='',bak=null,lobby=null,servers=[],panelOpen=0,ac='#22c55e';
const unlocked=new Set(),held=new Set(),comps=new Map(),occ=new Map(),P={x:.5,y:.5},D={};
const def=(t,n,cat,ni,sym,o={})=>D[t]={t,n,cat,ni,sym,...o};
const V=c=>{const o=D[c.t].opts;return o?(o[c.cfg|0]??o[0]):0};
const rise=(c,v,k='p')=>{const r=v&&!c.s[k];c.s[k]=v;return r};
const pl1=(x,y)=>Math.floor(P.x)==x&&Math.floor(P.y)==y;
const others=()=>role=='solo'||!net.nr?[]:net.nr.peers().filter(p=>!p.isMe&&p.presence&&typeof p.presence.x=='number').map(p=>({x:p.presence.x,y:p.presence.y,n:String(p.presence.n||'Jogador').slice(0,16),peer:p.peer}));
const pl=(x,y)=>pl1(x,y)||others().some(o=>Math.floor(o.x)==x&&Math.floor(o.y)==y);
const at=(x,y)=>comps.get(occ.get(K(x,y)));
const grp=(c,i)=>c.ins.map((s,n)=>s?i[n]:null).filter(v=>v!==null);
// Logic
def('AND','AND','Logic',2,'&',{f:(c,i)=>i[0]&i[1]});
def('OR','OR','Logic',2,'≥1',{f:(c,i)=>i[0]|i[1]});
def('XOR','XOR','Logic',2,'=1',{f:(c,i)=>i[0]^i[1]});
def('NOT','NOT','Logic',1,'¬',{f:(c,i)=>+!i[0]});
def('NAND','NAND','Logic',2,'⊼',{f:(c,i)=>+!(i[0]&i[1])});
def('NOR','NOR','Logic',2,'⊽',{f:(c,i)=>+!(i[0]|i[1])});
def('XNOR','XNOR','Logic',2,'⊙',{f:(c,i)=>+!(i[0]^i[1])});
def('AND8','AND 8-bit','Logic',8,'&8',{f:(c,i)=>{const k=grp(c,i);return +(k.length>0&&k.every(v=>v))}});
def('OR8','OR 8-bit','Logic',8,'≥8',{f:(c,i)=>+grp(c,i).some(v=>v)});
def('COUNTER','Counter','Logic',2,'#',{opts:[2,3,4,5,8],f:(c,i)=>{const s=c.s;if(i[1])s.n=0;else if(rise(c,i[0])){s.n=(s.n|0)+1;if(s.n>=V(c)){s.n=0;s.h=3}}return s.h>0?(s.h--,1):0}});
def('DLATCH','D-Latch','Logic',2,'DL',{f:(c,i)=>{if(i[1])c.s.q=i[0];return c.s.q|0}});
def('TFF','T-Flip-Flop','Logic',1,'T',{f:(c,i)=>{if(rise(c,i[0]))c.s.q=+!c.s.q;return c.s.q|0}});
def('SHIFT','Shift Register','Logic',2,'»',{f:(c,i)=>{c.s.r=c.s.r||[0,0,0,0];if(rise(c,i[1]))c.s.r=[i[0],...c.s.r.slice(0,3)];return c.s.r[3]}});
def('MATH','Math','Logic',2,'±',{opts:['SOMA','CARRY','A>B','A<B'],f:(c,i)=>[i[0]^i[1],i[0]&i[1],+(i[0]>i[1]),+(i[0]<i[1])][c.cfg|0]});
def('TIMER','Timer','Logic',1,'⏱',{opts:[1,2,3,5],f:(c,i)=>{c.s.t=i[0]?(c.s.t|0)+1:0;return +(c.s.t>=V(c)*20)}});
def('CLOCK','Clock','Logic',1,'∿',{opts:[.5,1,2,4],f:(c,i)=>(!c.ins[0]||i[0])?+(Math.floor(T/(V(c)*10))%2):0});
def('RANDOM','Randomizer','Logic',1,'?',{f:(c,i)=>{if(c.ins[0]?rise(c,i[0]):T%20==0)c.s.q=+(Math.random()<.5);return c.s.q|0}});
def('TX','Transmitter','Logic',1,'TX',{opts:[1,2,3,4],f:(c,i)=>{c.tx=i[0];return i[0]}});
def('RX','Receiver','Logic',0,'RX',{opts:[1,2,3,4],f:c=>air[V(c)]|0});
def('WIFI','WiFi','Logic',1,'📶',{opts:[1,2,3,4],f:(c,i)=>{c.tx=i[0];return air[V(c)]|0}});
// Inputs
def('BTN','Plate Button','Inputs',0,'●',{cl:c=>{c.s.on=1;held.add(c)},f:c=>c.s.on|0});
def('SWITCH','Switch','Inputs',0,'⇄',{cl:c=>c.s.on^=1,f:c=>c.s.on|0});
def('LEVER','Lever','Inputs',0,'/',{cl:c=>c.s.on^=1,f:c=>c.s.on|0});
def('PLATE','Pressure Plate','Inputs',0,'▭',{f:c=>+pl(c.x,c.y)});
def('LASERDET','Laser Detector','Inputs',0,'◉',{f:c=>det(c)});
def('DONTPRESS','Don’t Press Button','Inputs',0,'!',{cl:c=>{c.s.p=40;alarm=1;bc('Você não devia ter apertado isso…')},f:c=>c.s.p>0?(c.s.p--,1):0});
def('EMERG','EMERGENCY','Inputs',0,'SOS',{cl:c=>{c.s.on^=1;bc(c.s.on?'⚠️ EMERGÊNCIA ATIVADA':'Emergência desativada')},f:c=>c.s.on|0});
// Outputs
const tp=(a,b)=>({o:1,u:(c,i)=>{if(1)return;if(pl(c.x,c.y)&&(!c.ins[0]||i[0])){const t=[...comps.values()].find(o=>o.t==b);if(t){P.x=t.x+.5;P.y=t.y+.5;tpc=20;say('✨ Teleportado!')}}}});
def('LASER','Laser','Outputs',1,'▲',{o:1,u:(c,i)=>c.lon=c.ins[0]?i[0]:1});
def('LAMP','Light','Outputs',1,'💡',{o:1,col:'#ffe066'});
def('CPANEL','Color Light Panel','Outputs',1,'■',{o:1,col:'#38bdf8'});
def('RGB','RGB Light Panel','Outputs',3,'RGB',{o:1});
def('PISTON','Piston','Outputs',1,'⇥',{o:1,u:(c,i)=>{const on=c.ins[0]&&i[0],[dx,dy]=DIR[c.r],fx=c.x+dx,fy=c.y+dy;if(on){const o=at(fx,fy);if(o&&D[o.t].push&&!at(fx+dx,fy+dy)&&!solid(fx+dx,fy+dy)){occ.delete(K(o.x,o.y));o.x=fx+dx;o.y=fy+dy;occ.set(K(o.x,o.y),o.id);dirty=1}if(!at(fx,fy))nxt.add(K(fx,fy))}c.ext=on}});
def('TPA','Teleport Module A','Outputs',1,'A',tp('TPA','TPB'));
def('TPB','Teleport Module B','Outputs',1,'B',tp('TPB','TPA'));
def('BUZZ','Buzzer','Outputs',1,'🔔',{o:1,u:(c,i)=>tone(c,880,c.ins[0]&&i[0])});
def('SPEAK','Speaker','Outputs',1,'🔊',{o:1,opts:[262,330,392,523],u:(c,i)=>tone(c,V(c),c.ins[0]&&i[0])});
// Blocks
def('BLOCK','Block 1x1','Blocks',0,'■',{o:1,sol:1,push:1,col:'#8b95a5'});
def('GLASS','Glass','Blocks',0,'□',{o:1,sol:1});
def('OBSIDIAN','Obsidian','Blocks',0,'◆',{o:1,sol:1});
def('BARRIER','Invisible Barrier','Blocks',0,'✕',{o:1,sol:1});
def('POLE','Pole','Blocks',0,'│',{o:1,sol:1,col:'#cbd5e1'});
def('CORNER','Corner Pole','Blocks',0,'└',{o:1,sol:1,col:'#cbd5e1'});
def('TPOLE','T-Pole','Blocks',0,'┬',{o:1,sol:1,col:'#cbd5e1'});
def('POLE3','3 Sides Pole','Blocks',0,'⊓',{o:1,sol:1,col:'#cbd5e1'});
def('POLE4','4 Sides Pole 2','Blocks',0,'▢',{o:1,sol:1,col:'#cbd5e1'});
def('STAIRS','Stairs','Blocks',0,'▤',{o:1,col:'#a78b6a'});
def('DOOR','Door','Blocks',1,'🚪',{o:1,col:'#7c4a21'});
def('SPAWN','Spawn','Blocks',0,'S',{o:1,col:'#4ade80'});
// Others
def('NODE','Node','Others',1,'•',{f:(c,i)=>i[0]});
def('BATTERY','Battery','Others',0,'+',{f:()=>1});
def('DELAY','Delay','Others',1,'Δ',{opts:[.25,.5,1,2],f:(c,i)=>{const q=c.s.q=c.s.q||[],n=Math.round(V(c)*20);q.push(i[0]);while(q.length>n+1)q.shift();return q.length>n?q[0]:0}});
def('SIGN','Sign','Others',0,'✎',{o:1,cl:c=>say('📝 '+(c.txt||'Placa vazia. Use /text mensagem.'))});
// Hidden
def('CMDBLOCK','Command Block','Hidden',1,'CMD',{o:1,cl:c=>say('Command Block: '+(c.cmd||'/say Command Block ativado!')),u:(c,i)=>{if(rise(c,c.ins[0]&&i[0]))run(c.cmd||'/say Command Block ativado!')}});
def('NUKE','Nuclear TNT','Hidden',1,'☢',{o:1,u:(c,i)=>{if(c.ins[0]&&i[0])boom(c.x,c.y,99,1)}});
def('TNT','TNT','Hidden',1,'TNT',{o:1,u:(c,i)=>{if(c.ins[0]&&i[0])boom(c.x,c.y,3)}});
def('TNTACT','TNT Activator','Hidden',0,'⚡',{cl:c=>{c.s.p=3;for(const o of [...comps.values()])if(o.t=='TNT'&&!o.ins[0]&&Math.hypot(o.x-c.x,o.y-c.y)<=8)boom(o.x,o.y,3)},f:c=>c.s.p>0?(c.s.p--,1):0});

function add(t,x,y,r=0,id){if(occ.has(K(x,y))||comps.size>=1500)return null;dirty=1;if(id&&id>=nid)nid=id+1;const c={id:id||nid++,t,x,y,r,ins:Array(D[t].ni).fill(null),s:{},i:[],out:0,cfg:0};comps.set(c.id,c);occ.set(K(x,y),c.id);return c}
function del(c){dirty=1;tone(c,0,0);occ.delete(K(c.x,c.y));comps.delete(c.id);sel.delete(c.id);for(const o of comps.values())o.ins=o.ins.map(i=>i==c.id?null:i)}
const wire=(a,b,k)=>b.ins[k]=a.id;
function clearAll(){for(const c of [...comps.values()])del(c);expl=[]}
function solid(x,y){if(ext.has(K(x,y)))return 1;const c=at(x,y);if(!c)return 0;return c.t=='DOOR'?!c.i[0]:D[c.t].sol}
function opaque(x,y){const c=at(x,y);if(ext.has(K(x,y)))return 1;if(!c)return 0;return c.t=='DOOR'?!c.i[0]:D[c.t].sol&&c.t!='GLASS'&&c.t!='BARRIER'}
function det(c){const[dx,dy]=DIR[c.r];let f=0,b=0;for(let n=1;n<30;n++){const x=c.x+dx*n,y=c.y+dy*n,o=at(x,y);if(o&&o.t=='LASER'&&o.r==(c.r+2)%4){f=o.lon;break}if(opaque(x,y)||pl(x,y))b=1}return +(f&&b)}
function beam(c){const[dx,dy]=DIR[c.r];let n=1;for(;n<30;n++){const x=c.x+dx*n,y=c.y+dy*n;if(opaque(x,y)||pl(x,y))break}return n-1}
function tone(c,f,on){if(muted)on=0;if(on&&!c.osc){try{AC=AC||new AudioContext();const o=AC.createOscillator(),gn=AC.createGain();o.type=c.t=='BUZZ'?'square':'sine';o.frequency.value=f;gn.gain.value=.04;o.connect(gn).connect(AC.destination);o.start();c.osc=o}catch(e){}}else if(!on&&c.osc){try{c.osc.stop()}catch(e){}c.osc=null}}
function boom(x,y,r,n){expl.push({x:x+.5,y:y+.5,r:n?30:r,t:0});if(role=='host'&&net.nr)net.nr.emit('fx',{k:'b',x,y,r,n:n?1:0}).catch(()=>{});if(n){flash=1;bc('☢ NUCLEAR TNT!')}for(const c of [...comps.values()])if(n?c.t!='SPAWN':Math.hypot(c.x-x,c.y-y)<=r)del(c);if(n||Math.hypot(P.x-x-.5,P.y-y-.5)<=r){const s=[...comps.values()].find(c=>c.t=='SPAWN');P.x=s?s.x+.5:.5;P.y=s?s.y+.5:.5}}
function tick(){T++;if(tpc>0)tpc--;air={};nxt=new Set();
for(const c of comps.values()){if(c.tx)air[V(c)]=1;c.i=c.ins.map(id=>{const s=comps.get(id);return s?s.out|0:0})}

nr.on('perm',m=>{if(!fh(m))return;const d=m.data||{};net.perm=d.m||{};net.def=d.d|0;myLv=Math.max(0,Math.min(4,(net.perm[net.me]!=null?net.perm[net.me]:net.def)|0));if(panelOpen)panelUI();ui()});
nr.on('fx',m=>{if(!fh(m))return;const d=m.data||{};if(d.k=='b'){expl.push({x:d.x+.5,y:d.y+.5,r:d.n?30:d.r,t:0});if(d.n)flash=1;if(d.n||Math.hypot(P.x-d.x-.5,P.y-d.y-.5)<=d.r){const s=[...comps.values()].find(c=>c.t=='SPAWN');P.x=s?s.x+.5:.5;P.y=s?s.y+.5:.5}}});
nr.on('bye',m=>{if(fh(m)){say('O servidor foi fechado.');toMenu()}});
nr.onPeers(ch=>{if(role=='client'&&ch.left.some(p=>p.peer==net.hp)){say('O host saiu.');toMenu();return}if(panelOpen)panelUI()});
startGame();say('Conectando a '+sv.name+'…');A({k:'hello'})}
function reqWorld(){if(Date.now()-net.rq<700)return;net.rq=Date.now();A({k:'hello'})}
function applyWorld(b){const items=[];for(let i=0;i<b.N;i++)items.push(...(b.p[i]||[]));for(const c of comps.values())tone(c,0,0);comps.clear();occ.clear();sel.clear();for(const o of items){if(!Array.isArray(o)||!D[o[1]])continue;const c=add(o[1],o[2]|0,o[3]|0,(o[4]|0)&3,o[0]|0);if(c){c.col=typeof o[5]=='string'?o[5]:undefined;c.cfg=o[6]|0;c.txt=o[7]?String(o[7]):undefined;c.cmd=o[8]?String(o[8]):undefined;c.raw=o[9]}}
for(const c of comps.values()){const r=Array.isArray(c.raw)?c.raw:[];c.ins=c.ins.map((_,k)=>comps.has(r[k])?r[k]:null);delete c.raw;c.i=c.ins.map(id=>0)}dirty=0}
function leaveNet(){const wasHost=role=='host',nr=net.nr,was=role;try{if(wasHost&&nr)nr.emit('bye',{})}catch(e){}
role='solo';myLv=4;net={};perm={};ext=new Set();for(const c of comps.values())tone(c,0,0);if(was=='client'){clearAll();if(bak&&bak.length)inst(bak);else demo()}
if(nr)setTimeout(()=>nr.leave().catch(()=>{}),wasHost?500:0)}
setInterval(()=>{if(role=='client'&&net.av<0){if(++net.tries>10){say('O host não respondeu.');toMenu()}else{net.rq=0;reqWorld()}}},800);
// ===== menu principal e painel =====
let mview='auth';
function startGame(){scr='game';$('#menu').hidden=true;panelOpen=0;panelUI();ui();rs();if(net.nr)net.nr.presence({x:+P.x.toFixed(2),y:+P.y.toFixed(2),n:nick}).catch(()=>{})}
function showMenu(v){scr='menu';mview=v;panelOpen=0;panelUI();for(const c of comps.values())tone(c,0,0);$('#menu').hidden=false;menuRender()}
function toMenu(){if(role!='solo')leaveNet();showMenu('main')}
async function joinCode(c){c=(c||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'');if(c.length!==6)return'Código inválido. O código deve ter 6 caracteres.';if(!lobby)return'Multiplayer ainda está conectando. Recarregue a página e tente novamente.';await joinSrv({peer:'s-'+c,code:c,name:'Sala '+c.toUpperCase()});return''}
function menuRender(){const m=$('#mc'),v=mview;let h='';
if(v=='auth')h=`<h1>🔌 Circuit Sandbox</h1><h2>Entrar ou criar conta</h2><input type='text' id='nk' placeholder='Apelido' maxlength='16' autocomplete='username'><input type='password' id='pw' placeholder='Senha' autocomplete='current-password'><div class='err' id='er'></div><button data-a='signin'>Entrar</button><button class='alt' data-a='signup'>Criar conta</button><small>Sem e-mail: só apelido e senha. A conta e os mapas ficam salvos neste navegador${ls.ok()?'':' (armazenamento bloqueado: valem só nesta sessão)'}.</small>`;
else if(v=='main')h=`<h1>Olá, ${esc(nick)}!</h1><button data-a='play'>▶ Jogar sozinho</button><button data-a='host'>🖥️ Hospedar servidor</button><button data-a='join'>🌐 Entrar em servidor</button><button data-a='maps'>💾 Meus mapas</button><button data-a='sett'>⚙️ Configurações</button><button class='alt' data-a='out'>Sair da conta</button>`;
else if(v=='host')h=`<h2>Hospedar servidor</h2><input type='text' id='sn' placeholder='Nome do servidor' maxlength='24'><label>Cor (opcional) <input type='color' id='sc' value='#22c55e'></label><div class='err' id='er'></div><button data-a='dohost'>Hospedar</button><button class='alt' data-a='back'>Voltar</button>`;
else if(v=='join')h=`<h2>Entrar em servidor</h2><small>Peça o código de 6 caracteres ao anfitrião. As salas não aparecem numa lista pública.</small><input type='text' id='jc' placeholder='Código do servidor' maxlength='6' autocomplete='off'><div class='err' id='er'></div><button data-a='joincode'>Conectar</button><button class='alt' data-a='back'>Voltar</button>`;
else if(v=='maps')h=`<h2>Meus mapas (100 slots)</h2><div class='slots'>${Array.from({length:100},(_,i)=>{const id=String(i+1).padStart(3,'0');return `<button class='${ls.get(slotKey(id))?'':'alt'}' data-slot='${id}'>${id}</button>`}).join('')}</div><div class='err' id='er'></div><small>Slots cheios aparecem preenchidos. No jogo: /save 001 até /save 100 e /load 001 até /load 100.</small><button class='alt' data-a='back'>Voltar</button>`;
else if(v=='sett')h=`<h2>Configurações</h2><h4>Tema do mapa</h4><div class='th'>${Object.keys(TL).map(k=>`<button data-th='${k}'${theme==k?" style='outline:3px solid currentColor'":''}>${TL[k]}</button>`).join('')}</div><label>Cor do menu <input type='color' id='acm' value='${ac}'></label><button class='alt' data-a='back'>Voltar</button>`;
m.innerHTML=h}
$('#mc').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,er=t=>{const x=$('#er');if(x)x.textContent=t};
try{if(d.th){setTheme(d.th);menuRender();return}
if(d.code){const s=servers.find(q=>q.code==d.code);s&&joinSrv(s);return}
if(d.slot){const r=ls.get(slotKey(d.slot));if(!r)return er('Slot '+d.slot+' vazio.');clearAll();inst(JSON.parse(r).d);startGame();say('📂 Slot '+d.slot+' carregado.');return}
switch(d.a){
case'signin':er(await signin($('#nk').value.trim(),$('#pw').value)||'');break;
case'signup':er(await signup($('#nk').value.trim(),$('#pw').value)||'');break;
case'play':startGame();say('Bem-vindo, '+nick+'! Digite /help para ver os comandos.');break;
case'host':showMenu('host');break;
case'dohost':{const n=$('#sn').value.trim();if(n.length<3)return er('Dê um nome ao servidor (mínimo 3 letras).');er(await hostSrv(n,$('#sc').value)||'');break}
case'join':showMenu('join');break;
case'joincode':er(await joinCode($('#jc').value));break;
case'maps':showMenu('maps');break;
case'sett':showMenu('sett');break;
case'back':showMenu('main');break;
case'out':ls.del('cs:sess');nick='';showMenu('auth');break}}catch(x){er('Algo deu errado. Tente de novo.')}});
$('#mc').addEventListener('input',e=>{if(e.target.id=='acm')setAc(e.target.value)});
$('#mc').addEventListener('keydown',e=>{if(e.key=='Enter'&&mview=='auth'){const b=$('#mc [data-a=signin]');b&&b.click()}});
function panelUI(){const p=$('#panel');p.hidden=!panelOpen;if(!panelOpen)return;
let h='<h4>Tema do mapa</h4><div class="th">'+Object.keys(TL).map(k=>`<button class='${theme==k?'on':''}' data-th='${k}'>${TL[k]}</button>`).join('')+`</div><h4>Cor do menu</h4><div class="prow"><span>Cor</span><input type="color" id="acp" value="${ac}"></div><h4>Permissões</h4>`;
if(role=='solo')h+='<div style="color:var(--mu);font-size:12px">Disponível quando você hospeda um servidor.</div>';
else{const adm=role=='host'||myLv>=4;h+=`<div style="font-size:12px;color:var(--mu)">${esc(net.name)}${role=='host'?' · código '+esc(net.code.toUpperCase()):''}</div>`;
if(role=='host')h+=`<div class="prow">Padrão (novos)<select data-pd="1">${lvo(defPerm)}</select></div>`;
for(const q of net.nr.peers()){if(q.isMe||q.peer==net.hp)continue;const lv=role=='host'?lvOf(q.peer):((net.perm&&net.perm[q.peer]!=null?net.perm[q.peer]:net.def)|0);h+=`<div class="prow"><span>${esc(nm(q))}</span><select data-pp="${esc(q.peer)}"${adm?'':' disabled'}>${lvo(lv)}</select></div>`}
h+=`<div style="font-size:12px;color:var(--mu)">Seu nível: ${LVN[myLv]}</div>`}
h+='<button data-back="1">🏠 Voltar ao menu principal</button>';p.innerHTML=h}
$('#gear').onclick=()=>{panelOpen=!panelOpen;panelUI()};
$('#panel').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.th){setTheme(b.dataset.th);panelUI()}else if(b.dataset.back){panelOpen=0;panelUI();toMenu()}});
$('#panel').addEventListener('change',e=>{const t=e.target;if(t.dataset.pp)A({k:'setperm',peer:t.dataset.pp,lv:+t.value});else if(t.dataset.pd)A({k:'setdef',lv:+t.value})});
$('#panel').addEventListener('input',e=>{if(e.target.id=='acp')setAc(e.target.value)});
// ===== início =====
setAc(ls.get('cs:ac')||'#22c55e');setTheme(theme);rs();demo();ui();netInit();
{const s=ls.get('cs:sess'),u=s&&users()[s.toLowerCase()];if(u){nick=u.n;showMenu('main')}else showMenu('auth')}
requestAnimationFrame(frame);
